<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="weather.css">

</head>

<body>
    <div class="head">
        <h1>Weather Dashboard</h1>
    </div>
     <div>

            <button id="btn" class="mode">🌙</button>

        </div>

    <div class="container">

      

        <div class="search-section">
            <div class="search">

                 <input type="text" id="cityInput" placeholder="Enter city name..." />

                 <button id="searchBtn"><img src="weather_image/search.png " class="search_icon"></button>
                  
            </div>
            <div id="loader" class="loader">loading...</div>
            <div>
                <div id="errormsg" class="error"></div>  
            
                <button id="favoriteBtn">⭐ </button>

            </div>
           

              <div id="weatherCard" class="weather-card">
                <div>

                    <p>
                        <img id="weatherIcon" src="weather_image/clear.png" class="weather_icon">
                    </p>
                    <p id="temp" >---</p>
                   <h1 id="place">---</h1>
                    <p id="description">---</p>
                    </div>
                   <div>
                   <div class="bottom">
                    <div class="humwind">
                         
                        <img src="weather_image/humidity.png" class="humidity_icon">
                         <p>Humidity</p>
                        <p id="humidity">---</p>
                      
                    </div> 
                    <div class="humwind">
                        
                        <img src="weather_image/wind.png" class="wind_icon">
                        <p>wind speed</p>
                        <p id="wind">---</p>
                        
                    </div>
                   </div>
                    </div>
                   
              </div>
              

        </div>
        <div class="second-section">
            <h2 class="head2">Favorites⭐</h2>
 <div id="favoritesList" class="list"></div>
    </div>
        


       
    </div>
    



    <script type="text/javascript" src="weather.js">

        
          
    </script>

</body>

</html>
